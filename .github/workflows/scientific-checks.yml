name: Exact finite scientific checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONOPTIMIZE: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Replay exact finite records and regressions
        shell: bash
        run: |
          mkdir -p scientific-checks
          set -o pipefail
          ulimit -v 1048576
          ulimit -t 180
          timeout --signal=TERM --kill-after=10s 240s \
            python -B reproduce.py --output scientific-checks/reproduction.json \
            2>&1 | tee scientific-checks/runner.log
      - name: Check integer root comparisons and codebook boundaries
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s \
            python -B regressions/test_integer_roots.py -v \
            > scientific-checks/integer-roots.log 2>&1
      - name: Preserve raw output, including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finite-scientific-output
          path: scientific-checks/
          if-no-files-found: error
          retention-days: 14
